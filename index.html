<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic Tac Toe</title>
    <script>
      // Apply the theme before the first paint to avoid a flash of the wrong colours.
      (() => {
        let theme = null;
        try {
          theme = JSON.parse(localStorage.getItem('tic-tac-toe:theme'));
        } catch {
          // Storage unavailable: fall back to the system preference.
        }
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <link rel="icon" type="image/png" href="assets/img/logo.png" />
    <link rel="stylesheet" href="style.css" />
    <script
      src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.js"
      integrity="sha384-bopE5cbMjKUprmGnIRk2UdvCnHImrRLCtNW2uR6oDYqO+o3XWJeuIrWWxDzeDgNW"
      crossorigin="anonymous"
      defer
    ></script>
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <header class="app-header">
      <h1>Tic Tac Toe</h1>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false">
        <span class="visually-hidden">Helles Design</span>
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4" />
          <path
            d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
          />
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
        </svg>
      </button>
    </header>

    <main class="game">
      <form id="settings" class="settings" aria-label="Spieleinstellungen">
        <fieldset class="segmented">
          <legend>Gegner</legend>
          <label><input type="radio" name="mode" value="two-players" checked /> Zwei Spieler</label>
          <label><input type="radio" name="mode" value="computer" /> Computer</label>
        </fieldset>
        <fieldset class="segmented">
          <legend>Beginnt</legend>
          <label><input type="radio" name="startingPlayer" value="O" checked /> O</label>
          <label><input type="radio" name="startingPlayer" value="X" /> X</label>
        </fieldset>
        <p id="settings-note" class="settings-note" role="status" hidden>
          Änderungen gelten ab dem nächsten Spiel.
        </p>
      </form>

      <section class="scoreboard" aria-labelledby="scoreboard-title">
        <h2 id="scoreboard-title" class="visually-hidden">Punktestand</h2>
        <dl class="score-list">
          <div class="score score--o">
            <dt id="score-label-o">Spieler O</dt>
            <dd id="score-o">0</dd>
          </div>
          <div class="score">
            <dt>Unentschieden</dt>
            <dd id="score-draw">0</dd>
          </div>
          <div class="score score--x">
            <dt id="score-label-x">Spieler X</dt>
            <dd id="score-x">0</dd>
          </div>
        </dl>
        <button id="reset-score-button" class="text-button" type="button">
          Punktestand zurücksetzen
        </button>
      </section>

      <div class="board-wrapper">
        <div id="board" class="board" role="group" aria-label="Spielfeld"></div>
        <svg id="winning-line" class="winning-line" viewBox="0 0 300 300" aria-hidden="true"></svg>
      </div>

      <p id="status" class="status" role="status" aria-live="polite"></p>

      <button id="restart-button" class="restart-button" type="button" hidden>
        Spiel neu starten
      </button>
    </main>
  </body>
</html>
